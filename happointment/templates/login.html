{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content_auth %}
<h1>Login</h1>
<p class="subtitle">Patients, doctors, and admin all log in here.</p>
<form method="POST">
  <div>
    <label>Email</label>
    <input type="email" name="email" required>
  </div>
  <div>
    <label>Password</label>
    <input type="password" name="password" required>
  </div>
  <button type="submit">Log in</button>
</form>
<p class="muted">No account? <a href="{{ url_for('auth.register') }}">Register as a patient or doctor</a>.</p>
{% endblock %}
